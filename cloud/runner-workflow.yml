# Install only in the separately authorized private runner repository.
# This file is deliberately outside .github/workflows in public DENT-ELIT.
name: Private dental demo build
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Immutable cloud job UUID
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: dental-demo-${{ inputs.job_id }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event.repository.private == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: dental-demo-private
    steps:
      - name: Check out the reviewed immutable template
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: xugushik-source/DENT-ELIT
          ref: ${{ vars.TRUSTED_TEMPLATE_SHA }}
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install reviewed dependencies (no secrets)
        run: python -m pip install -r requirements-factory.txt
      - name: Build, test and return private artifact
        run: python cloud/runner.py
        env:
          FACTORY_JOB_ID: ${{ inputs.job_id }}
          TRUSTED_TEMPLATE_SHA: ${{ vars.TRUSTED_TEMPLATE_SHA }}
          FACTORY_CLOUD_ORIGIN: ${{ vars.FACTORY_CLOUD_ORIGIN }}
          FACTORY_BUILD_SECRET: ${{ secrets.FACTORY_BUILD_SECRET }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
# No upload-artifact, no schedule, no patient requests, no production deployment.
